# Grant flux_admin OIDC group full admin access to Flux resources
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: flux-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: flux-web-admin
subjects:
  - kind: Group
    name: flux_admin
    apiGroup: rbac.authorization.k8s.io
---
# Grant flux OIDC group read-only access to Flux resources
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: flux-viewer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: flux-web-user
subjects:
  - kind: Group
    name: flux
    apiGroup: rbac.authorization.k8s.io
