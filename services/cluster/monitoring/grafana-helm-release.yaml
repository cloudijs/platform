apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana
  namespace: cloudijs-monitoring
spec:
  interval: 5m
  releaseName: grafana
  targetNamespace: cloudijs-monitoring
  chart:
    spec:
      chart: grafana
      sourceRef:
        kind: HelmRepository
        name: grafana-community
        namespace: cloudijs-monitoring
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    route:
      main:
        enabled: true
        hostnames:
          - grafana.cloudijs.nl
        parentRefs:
          - name: shared-gateway-http
            namespace: cloudijs-system
        #httpsRedirect: true
